name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Unit, PHPStan and style
        run: composer ci
      - name: Analyze first-run CLI tools with PHPStan max
        run: vendor/bin/phpstan analyse --level=max --memory-limit=512M --no-progress tools/first-run-probe.php tools/verify-first-run-probe.php
      - name: Real HTTP adapter against localhost only
        shell: bash
        run: |
          set -euo pipefail
          port="$(php -r '$s = stream_socket_server("tcp://127.0.0.1:0", $error, $message); if (!$s) {exit(1);} echo (int) substr(strrchr(stream_socket_get_name($s, false), ":"), 1); fclose($s);')"
          export AGENT_DECISION_TEST_ENDPOINT="http://127.0.0.1:$port/v1/systemone"
          mkdir -p build
          php -S "127.0.0.1:$port" tests/fixtures/systemone-server.php > /dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if php -r '$s = @fsockopen("127.0.0.1", (int) $argv[1], $e, $m, 0.1); if ($s) { fclose($s); exit(0); } exit(1);' "$port"; then
              break
            fi
            sleep 0.1
          done
          php tools/verify-systemone-wire.php
          php tools/first-run-probe.php --mode=rules > build/probe-rules.json
          export AGENT_DECISION_PROVIDER_ENDPOINT="$AGENT_DECISION_TEST_ENDPOINT"
          export AGENT_DECISION_PROVIDER_TOKEN="local-test-token-only"
          php tools/first-run-probe.php --mode=shadow --public-approved --allow-loopback > build/probe-shadow.json
          php tools/first-run-probe.php --mode=assist --public-approved --allow-loopback > build/probe-assist.json
          php tools/verify-first-run-probe.php build/probe-rules.json build/probe-shadow.json build/probe-assist.json
          if php tools/first-run-probe.php --mode=assist --allow-loopback > /dev/null 2>&1; then
            echo "Remote probe ran without operator approval"
            exit 1
          fi
          set +e
          AGENT_DECISION_PROVIDER_TOKEN="probe-failure-test-token" php tools/first-run-probe.php --mode=assist --public-approved --allow-loopback > build/probe-auth-failure.json
          auth_result=$?
          set -e
          test "$auth_result" -eq 2
          grep -q '"preflight_status":"provider_failed"' build/probe-auth-failure.json
          ! grep -q 'probe-failure-test-token' build/probe-auth-failure.json
          set +e
          php tools/first-run-probe.php --fixture=experiments/public-fixtures/protected-routing.json --mode=assist --public-approved --allow-loopback > build/probe-protected.json
          protected_result=$?
          set -e
          test "$protected_result" -eq 2
          grep -q '"preflight_status":"provider_failed"' build/probe-protected.json
          grep -q '"provider_error":"insufficient_decision_evidence"' build/probe-protected.json
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
